<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>온티리스 눈</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* 레이아웃: 한 줄 머리 + 학생 카드 목록(폰 한 열) → 학생 화면은 모델 한 단락 + 날짜별 사진 그리드 */
:root{
  --bg:#f6f4ef; --paper:#fffdf9; --ink:#23211d; --ink-2:#6b655b; --line:#e4dfd4;
  --accent:#2f5d50; --accent-ink:#ffffff; --warn:#b4541e; --warn-bg:#fbeee5; --ok:#2f5d50; --ok-bg:#e6efeb;
  --display:"Gowun Batang",Georgia,"Apple SD Gothic Neo",serif;
  --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17160f; --paper:#201f17; --ink:#ece7dc; --ink-2:#a39d90; --line:#36342b;
  --accent:#8fc3b2; --accent-ink:#10201b; --warn:#f0a06e; --warn-bg:#3a271a; --ok:#8fc3b2; --ok-bg:#1f3129; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17160f; --paper:#201f17; --ink:#ece7dc; --ink-2:#a39d90; --line:#36342b;
  --accent:#8fc3b2; --accent-ink:#10201b; --warn:#f0a06e; --warn-bg:#3a271a; --ok:#8fc3b2; --ok-bg:#1f3129; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:baseline;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line);z-index:2}
.top h1{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:.02em}
.top .date{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.top .sp{flex:1}
.top button{color:var(--ink-2);font-size:13px}
.wrap{max-width:720px;margin:0 auto}
.list{display:grid;gap:10px;padding-block:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;text-align:left;width:100%}
.card .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .who{font-weight:600;font-size:16px}
.card .meta{color:var(--ink-2);font-size:13px}
.card .gap{font-size:14px;line-height:1.5;min-width:0}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-variant-numeric:tabular-nums}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.quiet{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.empty{color:var(--ink-2);padding-block:40px;text-align:center}
.key{display:grid;gap:10px;max-width:420px;margin:48px auto}
.key p{margin:0;color:var(--ink-2);font-size:14px}
.key input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);width:100%}
.btn{background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:8px;font-weight:600}
.back{color:var(--ink-2);font-size:14px;padding-block:12px 0}
.head{display:grid;gap:4px;padding-block:8px 14px}
.head h2{font-family:var(--display);font-size:24px;margin:0;font-weight:700}
.head .meta{color:var(--ink-2);font-size:13px}
.sec{padding-block:10px 18px;border-top:1px solid var(--line)}
.sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;font-weight:600}
.model{display:grid;gap:10px}
.model .k{font-size:12px;color:var(--ink-2)}
.model .v{white-space:pre-wrap;word-break:break-word;font-size:14px}
.day{display:grid;gap:8px;padding-block:6px 14px}
.day .d{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.grid a{display:block;aspect-ratio:3/4;max-width:100%;overflow:hidden;border-radius:6px;background:var(--line)}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .pending{display:grid;place-items:center;font-size:12px;color:var(--ink-2)}
.msgs{display:grid;gap:8px}
.msg{font-size:14px;white-space:pre-wrap;word-break:break-word;padding:8px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.msg.agent{border-color:transparent;background:var(--ok-bg)}
.msg .t{display:block;font-size:11px;color:var(--ink-2);margin-bottom:2px;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink-2);font-weight:500;font-size:12px}
.tbl{overflow-x:auto}
.err{color:var(--warn);font-size:14px;padding-block:20px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px;word-break:break-word}
.sec h3 .n{font-weight:400;letter-spacing:0;text-transform:none;margin-left:6px}
.hyps{display:grid;gap:8px}
.hyp{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:9px 12px;display:grid;gap:3px;min-width:0}
.hyp.now{border-left-color:var(--accent)}
.hyp.cross{border-left-color:var(--ok);opacity:.85}
.hyp.drop{opacity:.7}
.hyp .s{font-size:14px;word-break:break-word}
.hyp .e,.hyp .r{font-size:12.5px;color:var(--ink-2);word-break:break-word}
.hyp .r::before{content:"→ "}
.hyp .st{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
details{margin-top:8px}
details summary{color:var(--ink-2);font-size:13px;cursor:pointer;padding-block:4px}
details[open] summary{margin-bottom:8px}
.preds{display:grid;gap:6px}
.pred{display:flex;gap:8px;align-items:baseline;font-size:14px;min-width:0}
.pred .s{flex:1;min-width:0;word-break:break-word}
.pred .w{font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tally{font-size:13px;color:var(--ink-2);margin-bottom:8px}
.obsday{display:grid;gap:10px;padding-block:4px 14px}
.obsday .d{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:grid;gap:6px;min-width:0}
.sheet .h{font-size:13px;font-weight:600}
.sheet .sum{font-size:13px;color:var(--ink-2);word-break:break-word}
.items{display:grid;gap:3px}
.it{display:grid;grid-template-columns:3.2em 2.2em 1.4em 1fr;gap:6px;font-size:13px;align-items:baseline;min-width:0}
.it .no{font-variant-numeric:tabular-nums;font-weight:600}
.it .x{color:var(--warn)}
.it .o{color:var(--ok)}
.it .nt{color:var(--ink-2);word-break:break-word;min-width:0}
.grid a{position:relative}
.grid .ob{position:absolute;right:4px;bottom:4px;font-size:10.5px;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
.grid .ob.err{background:var(--warn);color:#fff}
/* 숫자 줄 · 새 방 · 장부 */
.strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:13px;color:var(--ink-2);text-align:left;width:100%}
.strip b{color:var(--ink);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;margin-right:2px}
.strip .lead{color:var(--ink);font-weight:600}
.strip.under b.sent{color:var(--warn)}
.h3x{font-size:12px;letter-spacing:.08em;color:var(--ink-2);margin:18px 0 8px;font-weight:600}
.room{background:var(--paper);border:1px dashed var(--warn);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.room .t{font-size:13.5px;word-break:break-word}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.f input,.f select,.f textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.f textarea{grid-column:1/-1;min-height:2.6em;resize:vertical}
.f .wide{grid-column:1/-1}
.btn.sm{padding:8px 12px;font-size:14px}
.msgline{font-size:13px;color:var(--ink-2);min-height:1.2em}
.msgline.bad{color:var(--warn)}
.lg{display:grid;gap:8px;padding-block:6px 14px}
.lgr{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.lgr .top2{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.lgr .top2 .w{font-weight:600}
.lgr .pb{font-size:13px;color:var(--ink-2);word-break:break-word}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
/* 승인·이행 버튼 */
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.act{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--bg)}
.act.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.act.armed{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.consent{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.recrow{display:grid;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;min-width:0}
.recrow .m{color:var(--ink-2);font-size:12.5px;word-break:break-word}
.recrow .p{word-break:break-word}
.recs{display:grid;gap:8px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.chk input{width:auto}
.draft{background:var(--paper);border:1px solid var(--accent);border-radius:8px;padding:9px 12px;display:grid;gap:6px;min-width:0}
.draft.done{border-color:var(--line);opacity:.75}
.draft textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-height:6em;resize:vertical}
/* 보낼 글 — 고쳐서 바로 보내기 */
.outbox{display:grid;gap:10px;padding-block:2px 6px}
.draft .who2{font-weight:600;color:var(--ink)}
.draft .cnt{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.draft .tell{font-size:12.5px;color:var(--warn);word-break:break-word}
.draft .tell:empty,.draft .err:empty{display:none}
.draft .err{font-size:12.5px;color:var(--warn);word-break:break-word}
.act.send{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.act.send.armed{background:var(--warn);color:#fff}
.act:disabled{opacity:.6}
.nameedit{display:flex;gap:6px;align-items:center}
.nameedit input{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:9em}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}
</style></head><body>
<div class="wrap">
  <header class="top">
    <h1>온티리스 눈</h1>
    <span class="date" id="today"></span>
    <span class="sp"></span>
    <button id="ledgerbtn" type="button">장부</button>
    <button id="refresh" type="button">새로 고침</button>
    <button id="logout" type="button" hidden>열쇠 지우기</button>
  </header>
  <main id="main"></main>
</div>

<script>
const API = "https://ippyzlrprvmvuimlrbqw.supabase.co/functions/v1/eye";
const $ = (s) => document.querySelector(s);
const main = $("#main");
let key = "";
try { key = localStorage.getItem("eye_key") || ""; } catch (_) {}
let view = { name: "home" };

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 이름은 이 폰에만 저장된다(서버·DB·AI로 가지 않음). 화면에는 "이름 (별칭)"
let NAMES = {};
try { NAMES = JSON.parse(localStorage.getItem("eye_names") || "{}") || {}; } catch (_) {}
const saveNames = () => { try { localStorage.setItem("eye_names", JSON.stringify(NAMES)); } catch (_) {} };
const who = (u, alias) => NAMES[u] ? `${NAMES[u]} (${alias || u.slice(0, 4)})` : (alias || "새 방 " + u.slice(0, 4));
// 보낼 글을 고치던 중이면 이 폰에 잠깐 남겨 둔다(새로 고침해도 안 날아가게). 보내거나 버리면 지운다
let EDITS = {};
try { EDITS = JSON.parse(localStorage.getItem("eye_draft_edits") || "{}") || {}; } catch (_) {}
const saveEdits = () => { try { localStorage.setItem("eye_draft_edits", JSON.stringify(EDITS)); } catch (_) {} };
const kst = (iso) => new Date(new Date(iso).getTime() + 9 * 3600e3);
const hm = (iso) => kst(iso).toISOString().slice(11, 16);
const md = (iso) => { const d = kst(iso); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`; };
const dayLabel = (ymd) => { const [y, m, d] = ymd.split("-").map(Number); const w = "일월화수목금토"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]; return `${m}월 ${d}일 (${w})`; };

async function call(params) {
  const u = new URL(API); Object.entries({ ...params, k: key }).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u);
  if (r.status === 401) throw new Error("auth");
  if (!r.ok) throw new Error("서버 " + r.status);
  return r.json();
}

async function post(body) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...body, k: key }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error("auth");
  if (!r.ok) throw new Error(j.error || ("서버 " + r.status));
  return j;
}

function stripHtml(t, clickable) {
  if (!t) return "";
  const under = t.sent < 20;
  return `<${clickable ? 'button type="button" id="strip"' : "div"} class="strip ${under ? "under" : ""}">
    <span class="lead">지난 7일</span>
    <span><b class="sent">${t.sent}</b>/20 제안${t.inbound ? ` · 들어온 문의 ${t.inbound}` : ""}</span>
    <span><b>${t.replied}</b>답장</span><span><b>${t.called}</b>상담</span><span><b>${t.demo}</b>체험</span><span><b>${t.paid}</b>결제</span>
    <span>· 누적 결제 <b>${t.paid_all}</b>/2 (11/15)</span></${clickable ? "button" : "div"}>`;
}

const STATUS_KO = { trial: "체험", member: "회원", contact: "상담 전", left: "끝남" };
function roomsHtml(rooms, invites) {
  if (!rooms?.length) return "";
  const inv = invites || [];
  const invLabel = (x) => `${x.from_key && NAMES[x.from_key] ? esc(NAMES[x.from_key]) + " " : ""}${esc(x.alias)}<span class="meta"> · ${esc([x.from_key ? "보호자 방에서 옮김" : x.track, x.speech].filter(Boolean).join(" · "))}</span>`;
  return `<div class="h3x">새 방 ${rooms.length} — ${inv.length ? "들어올 학생 중 누군지 눌러 줘 (첫 글에 이름이 있으면 그걸로)" : "누군지 정해 줘 (실명 말고 별칭)"}</div><div class="list" style="padding-block:0">${rooms.map((r) => `
    <form class="room" data-u="${esc(r.user_key)}">
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:baseline"><span class="who" style="font-weight:600">새 방 ${esc(r.user_key.slice(0, 4))}</span>
        <span class="meta">글 ${r.messages} · 사진 ${r.photos} · ${md(r.first_seen)} 처음 · ${md(r.last_seen)} ${hm(r.last_seen)} 마지막</span>
        <button type="button" class="meta peek" style="margin-left:auto;color:var(--accent)">보기 →</button></div>
      ${r.texts.length ? `<div class="t">${r.texts.map((t) => "“" + esc(t) + "”").join("<br>")}</div>` : ""}
      ${inv.length ? `<div class="acts">${inv.map((x) => `<button type="button" class="act" data-inv="${x.id}" data-a="${esc(x.alias)}">${invLabel(x)}</button>`).join("")}</div>` : ""}
      <details ${inv.length ? "" : "open"}><summary>목록에 없으면 직접 입력</summary>
      <div class="f">
        <input name="alias" placeholder="별칭 (예: SY)" maxlength="20" required autocomplete="off">
        <input name="grade" placeholder="학년 (예: 고2)" maxlength="20" autocomplete="off">
        <input name="subjects" placeholder="과목 (예: 수학·영어)" maxlength="40" autocomplete="off">
        <select name="status"><option value="trial">체험</option><option value="member">회원(기존 수업)</option><option value="contact">상담 전</option></select>
        <label class="chk wide"><input type="checkbox" name="consent" value="1"> 약속 한 장·자료 안내에 '네' 받음 (없으면 사진을 AI가 안 읽음)</label>
        <button class="btn sm wide" type="submit">등록</button>
      </div></details><div class="msgline"></div></form>`).join("")}</div>`;
}
function bindRooms() {
  main.querySelectorAll("form.room").forEach((f) => {
    f.querySelector(".peek")?.addEventListener("click", () => go({ name: "student", u: f.dataset.u }));
    // 들어올 학생 목록에서 하나: 두 번 눌러 등록(보호자 방에서 옮겨 오는 학생은 기록까지 같이 옮겨짐)
    f.querySelectorAll("[data-inv]").forEach((b) => b.addEventListener("click", async () => {
      const line = f.querySelector(".msgline");
      if (!b.classList.contains("armed")) { f.querySelectorAll("[data-inv].armed").forEach((x) => { x.classList.remove("armed"); x.innerHTML = x.dataset.l; });
        b.dataset.l = b.innerHTML; b.classList.add("armed"); b.textContent = `한 번 더 누르면 ${b.dataset.a}로 등록`; return; }
      b.disabled = true; line.className = "msgline"; line.textContent = "등록 중…";
      try { await post({ action: "invite_use", u: f.dataset.u, invite_id: Number(b.dataset.inv) }); go({ name: "home" }); }
      catch (err) { if (String(err.message) === "auth") return go({ name: "home" }); b.disabled = false; line.className = "msgline bad"; line.textContent = "안 됐어: " + err.message; }
    }));
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(f), line = f.querySelector(".msgline");
      line.className = "msgline"; line.textContent = "저장 중…";
      try { await post({ action: "register", u: f.dataset.u, alias: fd.get("alias"), grade: fd.get("grade"), subjects: fd.get("subjects"), status: fd.get("status"), consent: fd.get("consent") === "1" }); go({ name: "home" }); }
      catch (err) { if (String(err.message) === "auth") return go({ name: "home" }); line.className = "msgline bad"; line.textContent = "안 됐어: " + err.message; }
    });
  });
}

const STEP_KO = [["replied_at", "답장"], ["called_at", "상담"], ["demo_at", "체험"], ["paid_at", "결제"]];
async function ledgerView() {
  main.innerHTML = `<div class="empty">보는 중…</div>`;
  const d = await call({ view: "ledger" });
  $("#today").textContent = d.today.replace(/-/g, ".");
  $("#logout").hidden = false;
  const rows = d.rows.map((r) => `
    <div class="lgr" data-id="${r.id}">

function silentPill(s) {
  if (s.photos.today > 0) return `<span class="pill">오늘 ${s.photos.today}장</span>`;
  if (s.days_silent == null) return "";
  if (s.days_silent >= 5) return `<span class="pill warn">${s.days_silent}일째 없음</span>`;
  if (s.days_silent >= 2) return `<span class="pill quiet">${s.days_silent}일 전</span>`;
  return `<span class="pill quiet">어제</span>`;
}

function obsPill(o) {
  if (!o) return "";
  if (o.stopped) return `<span class="pill warn">읽기 멈춤 ${o.stopped}</span>`;
  if (o.error) return `<span class="pill warn">읽기 실패 ${o.error}</span>`;
  if (o.waiting) return `<span class="pill quiet">읽을 사진 ${o.waiting}</span>`;
  return "";
}
function consentPill(s) {
  if (s.consent_on) return "";
  if (!s.ai_ok) return `<span class="pill warn">동의 전 · AI 안 읽음${s.observe?.held ? " " + s.observe.held + "장 대기" : ""}</span>`;
  return `<span class="pill quiet">동의 전 (10/31까지)</span>`;
}

      ${done.map((p) => `<div class="pred">${pill(p.outcome)}<span class="s">${esc(p.statement)}${p.note ? ` <span class="meta">· ${esc(p.note)}</span>` : ""}</span><span class="w">${esc(p.checked_on || p.made_on || "")}</span></div>`).join("")}

function obsHtml(list) {

        ${sums.length ? `<details><summary>장 요약 ${sums.length}</summary><div class="sum">${sums.map(esc).join("<br>")}</div></details>` : ""}
      </div>`;

    return `<div class="obsday"><div class="d">${dayLabel(day)}</div>${sheets}</div>`;
  }).join("");
}
const OB_LABEL = { done: "", skip: "", waiting: "읽기 전", error: "실패", stopped: "멈춤" };

// ---- 보낼 글(초안) — 홈 맨 위와 학생 화면이 같은 카드를 쓴다 ----
const DK = { "질문 답": "질문 답", "한 줄": "아침 한 줄", "카톡 문제": "카톡 문제", "인사": "인사" };
// AI 티 검사 — 예약 작업이 쓴 뒤 검사하는 목록과 같은 것. 보내기 전에 눈으로 한 번 더
const TELLS = [[/핵심은/, "핵심은"], [/정리하면|요약하면|결론적으로/, "정리하면"], [/(^|\s)즉,/, "즉,"], [/첫째|둘째/, "첫째·둘째"],
  [/하는 것이 중요/, "~하는 것이 중요"], [/보는 건 어떨까요/, "~해 보는 건 어떨까요"], [/도움이 되었으면|도움이 되길/, "도움이 되었으면"],
  [/→/, "화살표"], [/\*\*/, "굵은 글씨"], [/^\s*(#|[-•]\s)/m, "목록·소제목"], [/화이팅|파이팅/, "화이팅"], [/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u, "이모티콘"]];
function tellsOf(text, x) {
  const out = TELLS.filter(([re]) => re.test(text)).map(([, l]) => l);
  if (x.alias && !x.guardian && /주세요/.test(text)) out.push("학생에겐 '~해 주세요' 말고 '~해 줘요'");
  return out;
}
// 보낼 때 빈 줄마다 말풍선 하나로 나뉜다(서버 eye와 같은 규칙, 최대 4개)
function bubbles(t) {
  const ps = t.split(/\n[ \t]*\n+/).map((x) => x.trim()).filter(Boolean);
  return ps.length <= 4 ? ps : [...ps.slice(0, 3), ps.slice(3).join("\n")];
}
function draftCard(x, withWho) {
  const when = `${esc(DK[x.kind] || x.kind)} · ${md(x.made_at)} ${hm(x.made_at)}`;
  if (x.sent_at) return `<div class="draft done"><div class="meta">${when}${x.sent_text === "" ? " · 버림" : ` · 보냄 ${hm(x.sent_at)}${x.sent_via === "대시보드" ? " (여기서)" : ""}`}</div>${x.sent_text === "" ? "" : `<div class="msg">${esc(x.sent_text || x.text)}</div>`}</div>`;
  const head = withWho ? `<span class="who2">${esc(who(x.user_key, x.alias))}${x.guardian ? " · 보호자 방" : ""}</span> · ` : "";
  return `<div class="draft" data-draft="${x.id}" data-guardian="${x.guardian ? 1 : 0}" data-alias="${esc(x.alias || "")}">
    <div class="meta">${head}${when}</div>
    <textarea aria-label="보낼 글">${esc(EDITS[x.id] ?? x.text)}</textarea>
    <div class="cnt"></div><div class="tell"></div>${x.send_error ? `<div class="err">지난번엔 안 갔어: ${esc(x.send_error)}</div>` : ""}
    <div class="acts">${x.channel === false ? "" : `<button type="button" class="act send" data-send="1">카톡으로 보내기</button>`}<button type="button" class="act" data-copy="1">복사</button><button type="button" class="act" data-sent="1">직접 보냈음</button><button type="button" class="act" data-skip="1">버림</button>${withWho ? `<button type="button" class="act" data-open="${esc(x.user_key)}">학생 화면</button>` : ""}</div>
    <div class="msgline"></div></div>`;
}
function bindDrafts(reload) {
  main.querySelectorAll("[data-draft]").forEach((card) => {
    const id = Number(card.dataset.draft), ta = card.querySelector("textarea"), line = card.querySelector(".msgline");
    if (!ta) return;
    const x = { guardian: card.dataset.guardian === "1", alias: card.dataset.alias };
    const sendB = card.querySelector("[data-send]");
    let timer = null;
    const disarm = () => { clearTimeout(timer); if (sendB && !sendB.disabled) { sendB.classList.remove("armed"); sendB.textContent = "카톡으로 보내기"; } };
    const check = () => { const t = ta.value.trim(), bs = bubbles(t), long = bs.some((b) => b.length > 300);
      card.querySelector(".cnt").textContent = `${t.length}자${bs.length > 1 ? ` · 말풍선 ${bs.length}개` : ""}${t.length > 1000 ? " — 1000자까지" : ""}${long ? " · 말풍선 하나가 길어요(빈 줄로 나누면 따로 나감)" : ""}`;
      const tl = tellsOf(t, x); card.querySelector(".tell").textContent = tl.length ? "AI 티: " + tl.join(" · ") : ""; };
    check();
    ta.addEventListener("input", () => { EDITS[id] = ta.value; saveEdits(); check(); disarm(); });
    const done = (msg) => { delete EDITS[id]; saveEdits(); line.className = "msgline"; line.textContent = msg; card.querySelectorAll("button").forEach((b) => (b.disabled = true)); setTimeout(reload, 800); };
    const fail = (b, err, label) => { if (String(err.message) === "auth") return go({ name: "home" }); b.disabled = false; if (label) b.textContent = label; line.className = "msgline bad"; line.textContent = "안 갔어: " + err.message; };
    sendB?.addEventListener("click", async () => {
      const t = ta.value.trim();
      if (!t) { line.className = "msgline bad"; line.textContent = "글이 비었어"; return; }
      const nb = bubbles(t).length;
      if (!sendB.classList.contains("armed")) { sendB.classList.add("armed"); sendB.textContent = `한 번 더 누르면 보냄 · ${nb > 1 ? `말풍선 ${nb}개` : `${t.length}자`}`; timer = setTimeout(disarm, 5000); return; }
      clearTimeout(timer); sendB.disabled = true; sendB.textContent = "보내는 중…"; line.className = "msgline"; line.textContent = "";
      try {
        const res = await post({ action: "draft_send", id, text: t }); sendB.classList.remove("armed");
        if (res.partial) { // 중간에 끊김: 간 것까지는 기록됨. 남은 말풍선은 칸에 남겨 복사해서 직접
          sendB.textContent = "일부만 감"; ta.value = res.rest || ""; EDITS[id] = ta.value; saveEdits(); check();
          line.className = "msgline bad"; line.textContent = res.warning || "일부만 나감 — 나머지는 복사해서 직접"; return;
        }
        sendB.textContent = "보냄 ✓"; done("카톡으로 나감 " + hm(new Date().toISOString()) + (res.bubbles > 1 ? ` · 말풍선 ${res.bubbles}개` : ""));
      }
      catch (err) { sendB.classList.remove("armed"); fail(sendB, err, "카톡으로 보내기"); }
    });
    card.querySelector("[data-copy]")?.addEventListener("click", async (e) => {
      const b = e.currentTarget;
      try { await navigator.clipboard.writeText(ta.value); b.textContent = "복사됨"; }
      catch (_) { ta.select(); try { document.execCommand("copy"); b.textContent = "복사됨"; } catch (__) { line.textContent = "길게 눌러 복사해 줘"; } }
    });
    card.querySelector("[data-sent]")?.addEventListener("click", async (e) => {
      const b = e.currentTarget; b.disabled = true;
      try { await post({ action: "draft_done", id, text: ta.value }); done("직접 보낸 것으로 기록"); } catch (err) { fail(b, err); }
    });
    card.querySelector("[data-skip]")?.addEventListener("click", async (e) => {
      const b = e.currentTarget;
      if (!b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "한 번 더 누르면 버림"; return; }
      b.disabled = true;
      try { await post({ action: "draft_done", id, skip: true }); done("버림"); } catch (err) { fail(b, err); }
    });
    card.querySelector("[data-open]")?.addEventListener("click", (e) => go({ name: "student", u: e.currentTarget.dataset.open }));
  });
}

  const box = d.drafts || [];
  const outbox = box.length ? `<div class="h3x">보낼 글 ${box.length} — 고쳐서 '카톡으로 보내기' 두 번 (누를 때만 나감)</div><div class="outbox">${box.map((x) => draftCard(x, true)).join("")}</div>` : "";
  main.innerHTML = `${banner}${outbox}${stripHtml(d.tally, true)}${roomsHtml(d.new_rooms, d.invites)}<div class="list">${items || `<div class="empty">아직 별칭이 붙은 학생이 없어.</div>`}</div>`;
  bindDrafts(() => go({ name: "home" }));
  main.querySelectorAll(".card").forEach((b) => b.addEventListener("click", () => go({ name: "student", u: b.dataset.u })));
  $("#strip")?.addEventListener("click", () => go({ name: "ledger" }));
  bindRooms();
}

async function student(u, days = 14) {
  main.innerHTML = `<div class="empty">보는 중…</div>`;
  const d = await call({ view: "student", u, days });
  const m = d.member, mo = d.model || {};
  const byDay = {};
  d.photos.forEach((p) => (byDay[p.day] ??= []).push(p));
  const days_html = Object.keys(byDay).sort().reverse().map((day) => `
    <div class="day"><div class="d">${dayLabel(day)} · ${byDay[day].length}장</div>
      <div class="grid">${byDay[day].sort((a, b) => a.seq - b.seq || a.idx - b.idx).map((p) => p.type !== "photo" && p.url
        ? `<a class="pending" href="${esc(p.url)}" target="_blank" rel="noopener">파일 열기</a>`
        : p.thumb
        ? `<a href="${esc(p.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(p.thumb)}" alt="${esc(m.alias)} ${day} ${p.seq}-${p.idx}">${OB_LABEL[p.observed] ? `<span class="ob ${p.observed === "waiting" ? "" : "err"}">${OB_LABEL[p.observed]}</span>` : ""}</a>`
        : `<a class="pending" href="#">${p.status === "failed" ? "저장 실패" : "처리 중"}</a>`).join("")}</div></div>`).join("");
  const model_html = ["current_gap:넘을 한 곳", "how_solving:푸는 방식", "next_risk:다음에 걸릴 것", "upcoming:앞에 있는 것"].map((kv) => { const [k, l] = kv.split(":"); return mo[k] ? `<div><div class="k">${l}${k === "current_gap" && mo.gap_since ? ` · ${esc(mo.gap_since)}부터 · ${mo.gap_hits ?? 0}번 걸림` : ""}</div><div class="v">${esc(mo[k])}</div></div>` : ""; }).join("");
  const msgs_html = d.messages.slice(0, 40).map((x) => `<div class="msg ${x.kind === "agent" ? "agent" : ""}"><span class="t">${md(x.sent_at)} ${hm(x.sent_at)}${x.kind === "agent" ? " · 나" : ""}</span>${esc(x.text)}</div>`).join("");
  const FOL = ["했다", "일부", "안 했다", "모름"];
  const recs_html = (d.records.length ? `<div class="recs">${d.records.map((r) => `<div class="recrow">
      <div class="m">${esc(r.on_date.slice(5).replace("-", "/"))} · ${esc(r.subject || "")}${r.verdict ? " · 판정 " + esc(r.verdict) : ""}${r.minutes != null ? " · " + esc(r.minutes) + "분" : ""}</div>
      ${r.target ? `<div class="p">${esc(r.target)}</div>` : ""}
      ${r.prescribed ? `<div class="p"><span class="meta">정한 것</span> ${esc(r.prescribed)}</div>
        <div class="acts"><span class="meta" style="align-self:center">했나</span>${FOL.map((v) => `<button type="button" class="act ${r.followed === v ? "on" : ""}" data-rec="${r.id}" data-v="${r.followed === v ? "clear" : v}">${v}</button>`).join("")}</div>` : ""}
      ${r.note ? `<div class="m">${esc(r.note)}</div>` : ""}</div>`).join("")}</div>` : `<div class="meta">아직 기록 없음</div>`) + `
    <details ${d.records.length ? "" : "open"}><summary>자리 한 줄 남기기</summary>
    <form id="recform" class="lgr"><div class="f">
      <input name="subject" placeholder="과목" maxlength="20" required autocomplete="off">
      <select name="verdict"><option value="">판정 —</option><option>넘었다</option><option>아직</option><option>모름</option></select>
      <input name="minutes" type="number" min="0" max="600" inputmode="numeric" placeholder="분" autocomplete="off">
      <textarea name="target" placeholder="넘으려던 것 / 확인한 것 (짐작 한 줄)" maxlength="300"></textarea>
      <textarea name="prescribed" placeholder="다음까지 하기로 정한 것 (학생이 할 행동 하나)" maxlength="300"></textarea>
      <textarea name="note" placeholder="메모 (실명 X)" maxlength="500"></textarea>
      <button class="btn sm wide" type="submit">기록</button></div><div class="msgline"></div></form></details>`;
  const mine = (d.drafts || []).map((x) => ({ ...x, user_key: m.user_key, alias: m.alias, guardian: !!m.guardian_of, channel: !m.user_key.startsWith("manual-") }));
  const pend = mine.filter((x) => !x.sent_at), doneD = mine.filter((x) => x.sent_at);
  const drafts_html = pend.length || doneD.length ? `<section class="sec"><h3>보낼 글<span class="n">${pend.length ? pend.length + "개 대기" : "대기 없음"}</span></h3>
    <div class="recs">${pend.map((x) => draftCard(x, false)).join("")}</div>
    ${doneD.length ? `<details><summary>보낸·버린 초안 ${doneD.length}</summary><div class="recs">${doneD.map((x) => draftCard(x, false)).join("")}</div></details>` : ""}</section>` : "";
  const consent_html = m.consent_on ? `<div class="consent"><span class="pill">동의 ${esc(m.consent_on.slice(5).replace("-", "/"))}</span></div>`
    : `<div class="consent"><span class="pill ${d.ai_ok ? "quiet" : "warn"}">${d.ai_ok ? "동의 전 · 10/31까지 유예" : "동의 전 · 사진을 AI가 읽지 않음"}</span><button type="button" class="act" id="consentbtn">'네' 받음 (오늘)</button></div>`;
  main.innerHTML = `
    <button class="back" type="button" id="back">← 전체</button>
    <div class="head"><h2>${esc(who(m.user_key, m.alias))}</h2>
      <div class="nameedit"><input id="namein" placeholder="이름(이 폰에만)" maxlength="10" value="${esc(NAMES[m.user_key] || "")}" autocomplete="off"><button type="button" class="act" id="namesave">이름 저장</button></div><div class="meta">${esc(m.grade || "")} · ${esc(m.subjects || "")} · ${esc(m.status)}${m.note ? ` · ${esc(m.note)}` : ""}</div>${m.alias ? consent_html : ""}</div>
    ${drafts_html}
    ${model_html ? `<section class="sec"><h3>모델</h3><div class="model">${model_html}</div></section>` : ""}
    <section class="sec"><h3>짐작<span class="n">${d.hypotheses.filter((h) => h.status === "지금" || h.status === "후보").length}개 살아 있음</span></h3>${hypsHtml(d.hypotheses)}</section>
    <section class="sec"><h3>예측</h3>${predsHtml(d.predictions)}</section>
    <section class="sec"><h3>관찰<span class="n">최근 ${d.days}일 · ${d.observations.filter((o) => o.mark !== "장 요약").length}줄</span></h3>${obsHtml(d.observations)}</section>
    <section class="sec"><h3>들어온 사진 · 최근 ${d.days}일 · ${d.photos.length}장 <button type="button" id="more" style="color:var(--accent);margin-left:8px">${d.days < 90 ? "더 보기" : ""}</button></h3>${days_html || `<div class="meta">없음</div>`}</section>
    <section class="sec"><h3>글</h3><div class="msgs">${msgs_html || `<div class="meta">없음</div>`}</div></section>
    <section class="sec"><h3>자리 기록 · 정한 것 · 했나</h3>${recs_html}</section>`;
  $("#back").addEventListener("click", () => go({ name: "home" }));
  bindStudent(u, days);
  $("#more")?.addEventListener("click", () => go({ name: "student", u, days: Math.min(90, days * 3) }));
  window.scrollTo(0, 0);
}

// 학생 화면의 쓰기: 보낼 글 · 동의 · 짐작 승인(두 번 눌러 확정) · 예측 확인 · 했나 · 자리 한 줄
function bindStudent(u, days) {
  const reload = () => go({ name: "student", u, days });
  $("#namesave")?.addEventListener("click", () => { const v = $("#namein").value.trim(); if (v) NAMES[u] = v; else delete NAMES[u]; saveNames(); reload(); });
  bindDrafts(reload);
  const fail = (b, err) => { if (String(err.message) === "auth") return go({ name: "home" }); b.disabled = false; b.textContent = "안 됨: " + err.message; };
  $("#consentbtn")?.addEventListener("click", async (e) => { const b = e.currentTarget; b.disabled = true; try { await post({ action: "consent", u }); reload(); } catch (err) { fail(b, err); } });
  main.querySelectorAll("[data-hyp]").forEach((b) => b.addEventListener("click", async () => {
    if (!b.classList.contains("armed")) { main.querySelectorAll(".act.armed").forEach((x) => { x.classList.remove("armed"); x.textContent = x.dataset.l; });
      b.dataset.l = b.textContent; b.classList.add("armed"); b.textContent = "한 번 더 누르면 확정"; return; }
    b.disabled = true;
    try { await post({ action: "hyp_set", id: Number(b.dataset.hyp), status: b.dataset.st }); reload(); } catch (err) { fail(b, err); }
  }));
  main.querySelectorAll("[data-pred]").forEach((b) => b.addEventListener("click", async () => {
    b.disabled = true; try { await post({ action: "pred_mark", id: Number(b.dataset.pred), outcome: b.dataset.o }); reload(); } catch (err) { fail(b, err); }
  }));
  main.querySelectorAll("[data-rec]").forEach((b) => b.addEventListener("click", async () => {
    b.disabled = true; try { await post({ action: "record_followed", id: Number(b.dataset.rec), value: b.dataset.v }); reload(); } catch (err) { fail(b, err); }
  }));
  const f = $("#recform");
  f?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(f), line = f.querySelector(".msgline");
    line.className = "msgline"; line.textContent = "저장 중…";
    try { await post({ action: "record_add", u, subject: fd.get("subject"), verdict: fd.get("verdict") || null, minutes: fd.get("minutes"), target: fd.get("target"), prescribed: fd.get("prescribed"), note: fd.get("note") }); reload(); }
    catch (err) { if (String(err.message) === "auth") return go({ name: "home" }); line.className = "msgline bad"; line.textContent = "안 됐어: " + err.message; }
  });
}

async function go(v) {
  view = v;
  if (!key) return askKey();
  try { v.name === "student" ? await student(v.u, v.days) : v.name === "ledger" ? await ledgerView() : await home(); }
  catch (e) {
    if (String(e.message) === "auth") { key = ""; try { localStorage.removeItem("eye_key"); } catch (_) {} return askKey("열쇠가 안 맞아. 다시 넣어 줘."); }
    main.innerHTML = `<div class="err">못 불러왔어: ${esc(e.message)}</div>`;
  }
}
$("#refresh").addEventListener("click", () => go(view));
$("#ledgerbtn").addEventListener("click", () => go({ name: "ledger" }));
$("#logout").addEventListener("click", () => { key = ""; try { localStorage.removeItem("eye_key"); } catch (_) {} askKey(); });
go({ name: "home" });
</script>
</body></html>
